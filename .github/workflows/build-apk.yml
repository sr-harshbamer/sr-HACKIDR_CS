name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Guardian Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        working-directory: ./android_app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0-apk
          name: Guardian App v2.0 (Debug APK)
          body: |
            ### Guardian App Android Build
            Direct installable APK for Android devices.
            - Built automatically via GitHub Actions
            - Android API 26-34 compatible
          files: android_app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
